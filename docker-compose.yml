services:
    postgres:
        image: postgres:18.6-alpine
        container_name: devpulse-postgres

        restart: unless-stopped

        environment:
            POSTGRES_USER: devpulse
            POSTGRES_PASSWORD: devpulse
            POSTGRES_DB: devpulse

        ports:
            - "127.0.0.1:5433:5432"

        volumes:
            - devpulse_postgres_data:/var/lib/postgresql

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 5s

volumes:
    devpulse_postgres_data:
